# nixpacks.toml - configuration Railway pour Laravel + Node 24 + PHP 8.4 + GD

[phases.setup]
nixPkgs = ["php84", "php84Extensions.gd", "nodejs_24"]

[phases.install]
cmds = [
  # Installer les dépendances PHP et Node
  "composer install --no-dev --optimize-autoloader",
  "npm install"
]

[phases.build]
cmds = [
  # Compiler les assets frontend
  "npm run build",
  # Activer les caches Laravel pour la prod
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache"
]

[start]
cmd = "php -S 0.0.0.0:$PORT -t public"