services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - danceclub_net
    volumes:
      - laravel_storage:/var/www/html/storage
      - laravel_cache:/var/www/html/bootstrap/cache
    depends_on:
      - pgsql
      - redis

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - danceclub_net
    depends_on:
      - app
    labels:
      # Traefik
      - "traefik.enable=true"
      
      # Port externe HTTPS
      - "traefik.http.routers.laravel.rule=Host(`mamukaserver2.duckdns.org`)"
      - "traefik.http.routers.laravel.entrypoints=websecure"
      - "traefik.http.routers.laravel.tls=true"
      - "traefik.http.routers.laravel.tls.certresolver=letsencrypt"

      # Redirection HTTP → HTTPS
      - "traefik.http.routers.laravel-http.rule=Host(`mamukaserver2.duckdns.org`)"
      - "traefik.http.routers.laravel-http.entrypoints=web"
      - "traefik.http.routers.laravel-http.middlewares=redirect-to-https"

      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

      # Port interne nginx
      - "traefik.http.services.laravel.loadbalancer.server.port=80"

  pgsql:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - danceclub_pgdata:/var/lib/postgresql/data
    networks:
      - danceclub_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - danceclub_redis:/data
    networks:
      - danceclub_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  laravel_storage:
  laravel_cache:
  danceclub_pgdata:
  danceclub_redis:

networks:
  danceclub_net:
    driver: bridge