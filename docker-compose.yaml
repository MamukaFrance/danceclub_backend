services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: danceclub_app
    restart: unless-stopped
    networks:
      - danceclub_net
      - traefik
    volumes:
      - laravel_storage:/var/www/html/storage
      - laravel_cache:/var/www/html/bootstrap/cache
    depends_on:
      - pgsql
      - redis

  nginx:
    image: nginx:alpine
    container_name: danceclub_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - danceclub_net
      - traefik
    depends_on:
      - app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.danceclub.rule=Host(`mamukaserver2.duckdns.org`)"
      - "traefik.http.routers.danceclub.entrypoints=websecure"
      - "traefik.http.routers.danceclub.tls=true"
      - "traefik.http.services.danceclub.loadbalancer.server.port=80"

  pgsql:
    image: postgres:18-alpine
    container_name: danceclub_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: laravel
      POSTGRES_USER: sail
      POSTGRES_PASSWORD: password
    volumes:
      - danceclub_pgdata:/var/lib/postgresql/data
    networks:
      - danceclub_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sail"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: danceclub_redis
    restart: unless-stopped
    volumes:
      - danceclub_redis:/data
    networks:
      - danceclub_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  laravel_storage:
  laravel_cache:
  laravel_public:
  danceclub_pgdata:
  danceclub_redis:

networks:
  danceclub_net:
    driver: bridge
    
  traefik:
    external: true
    name: dokploy-traefik